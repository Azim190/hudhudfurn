name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  # Shared by jobs that run the API against real backing services.
  S3_ENDPOINT: http://localhost:8333
  S3_ACCESS_KEY: ci
  S3_SECRET_KEY: ci-secret
  MEILI_HOST: http://localhost:7700
  MEILI_API_KEY: ci_master_key_ci_master_key

jobs:
  verify:
    name: Build, typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hudhud/api prisma:generate
      - run: pnpm turbo run build typecheck lint
        env:
          API_INTERNAL_URL: http://localhost:4100/api/v1
      - name: Unit tests (domain/i18n coverage gate ≥ 90%)
        run: pnpm turbo run test:cov

  api-integration:
    name: API integration tests (Postgres, Redis, S3, Meilisearch)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hudhud, POSTGRES_PASSWORD: hudhud, POSTGRES_DB: hudhud_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hudhud" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.15
        env: { MEILI_MASTER_KEY: ci_master_key_ci_master_key, MEILI_ENV: development }
        ports: ['7700:7700']
    env:
      TEST_DATABASE_URL: postgresql://hudhud:hudhud@localhost:5432/hudhud_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      # Service containers cannot take a command, so SeaweedFS (S3) is started here; without an
      # IAM config it accepts any credentials, which is fine for an ephemeral CI runner.
      - run: docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:3.97 server -s3 && npx --yes wait-on@8 -t 60000 tcp:localhost:8333
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@hudhud/domain --filter=@hudhud/i18n
      - run: pnpm --filter @hudhud/api prisma:generate
      - run: pnpm --filter @hudhud/api test:e2e

  e2e:
    name: Playwright E2E (AR + EN, RTL visual)
    runs-on: ubuntu-latest
    needs: [verify]
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hudhud, POSTGRES_PASSWORD: hudhud, POSTGRES_DB: hudhud }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hudhud" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      meilisearch:
        image: getmeili/meilisearch:v1.15
        env: { MEILI_MASTER_KEY: ci_master_key_ci_master_key, MEILI_ENV: development }
        ports: ['7700:7700']
    env:
      DATABASE_URL: postgresql://hudhud:hudhud@localhost:5432/hudhud?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access
      JWT_MFA_SECRET: ci-mfa-secret-ci-mfa-secret-ci-mfa-secret-ci
      OTP_PEPPER: ci-otp-pepper-ci-otp-pepper-ci-otp-pepper-ci
      ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      TRUST_PROXY: 'true'
      API_INTERNAL_URL: http://localhost:4100/api/v1
      STOREFRONT_URL: http://localhost:3100
      STOREFRONT_REVALIDATE_URL: http://localhost:3100/bff/revalidate
      REVALIDATE_SECRET: ci-revalidate-secret-ci-revalidate-secret
      S3_BUCKET: hudhud-media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8333/hudhud-media
      SEED_OWNER_EMAIL: owner@ci.test
      SEED_OWNER_PASSWORD: ci-owner-password-123
    steps:
      - uses: actions/checkout@v4
      - run: docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:3.97 server -s3 && npx --yes wait-on@8 -t 60000 tcp:localhost:8333
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hudhud/api prisma:generate
      # The API must be up before the web builds: they pre-render cached (ISR) pages from it.
      - run: pnpm turbo run build --filter=@hudhud/api...
      - name: Migrate and seed (reference data + bilingual sample catalog)
        run: |
          pnpm --filter @hudhud/api exec prisma migrate deploy
          pnpm --filter @hudhud/api prisma:seed
          (cd apps/api && node dist/cli/seed-catalog.js)
      - name: Start API
        run: |
          (cd apps/api && node dist/main.js &)
          npx --yes wait-on@8 -t 60000 http://localhost:4100/api/v1/health/ready
      - run: pnpm turbo run build --filter=@hudhud/storefront-web --filter=@hudhud/admin-web
      - name: Start storefront and admin
        run: |
          (cd apps/storefront-web && npx next start --port 3100 &)
          (cd apps/admin-web && npx next start --port 3101 &)
          npx --yes wait-on@8 -t 60000 http://localhost:4100/api/v1/health/ready http://localhost:3100/ar http://localhost:3101/ar/login
      - run: pnpm --filter @hudhud/e2e exec playwright install --with-deps chromium
      # Baselines are OS-specific; missing Linux baselines are written and uploaded for review.
      - run: pnpm --filter @hudhud/e2e exec playwright test --update-snapshots=missing
        env:
          E2E_ADMIN_EMAIL: owner@ci.test
          E2E_ADMIN_PASSWORD: ci-owner-password-123
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            e2e/playwright-report
            e2e/tests/*-snapshots
