# Builds the three production images, pushes them to GHCR and deploys them to the VPS.
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0) or by hand from the
# Actions tab ("Run workflow", on main or on an older tag to roll back). See deploy/README.md.
#
# Repository settings > Environments > production:
#   secrets: VPS_SSH_KEY (private key of the deploy user), VPS_KNOWN_HOSTS (ssh-keyscan output)
#   variables: VPS_HOST, VPS_USER (deploy), VPS_PORT (22), DEPLOY_PATH (/opt/hudhud)
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [api, storefront, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hudhud-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          # ADMIN_URL is baked into the storefront's /admin proxy; it must match deploy/compose.yml.
          build-args: |
            SERVICE=${{ matrix.service }}
            ADMIN_URL=http://admin:3101
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          push: true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_TARGET: ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}
      SSH_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/hudhud' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ vars.VPS_HOST }}" "${{ vars.VPS_USER }}" "$SSH_PORT" > ~/.ssh/config

      - name: Upload deploy files
        # .env and certs/ stay on the server and are never uploaded or overwritten.
        run: |
          tar -czf - -C deploy compose.yml Caddyfile .env.example README.md backup scripts \
            | ssh vps "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh vps "cd '$DEPLOY_PATH' && bash scripts/deploy.sh '${{ github.sha }}'"

      - name: Check the public site
        run: |
          domain=$(ssh vps "grep '^DOMAIN=' '$DEPLOY_PATH/.env' | cut -d= -f2")
          for url in "https://$domain/ar" "https://$domain/admin/ar/login" "https://api.$domain/api/v1/health/ready"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$code $url"
            [ "$code" = "200" ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://api.$domain/api/v1/dev/sms")
          echo "$code https://api.$domain/api/v1/dev/sms (must be 404)"
          [ "$code" = "404" ]

      - name: Sign out of GHCR on the server
        if: always()
        run: ssh vps "docker logout ghcr.io" || true
