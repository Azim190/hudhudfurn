packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  sharp: true
  "@nestjs/core": true
  esbuild: true
  unrs-resolver: true
  "@scarf/scarf": false
  "@parcel/watcher": true
  "@swc/core": true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1152.0'
# Windows Smart App Control blocks rollup's unsigned native binary on some developer machines;
# the official WebAssembly build is functionally identical (used by vite/vitest).
overrides:
  rollup: npm:@rollup/wasm-node@4.64.5
