# Local development infrastructure. Production uses managed equivalents (see docs/guides/deployment.md).
name: hudhud

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hudhud
      POSTGRES_PASSWORD: hudhud
      POSTGRES_DB: hudhud
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hudhud"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: dev_master_key_change_me_please
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meilidata:/meili_data]

  # S3-compatible object storage (MinIO no longer publishes public images).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  s3data:
